name = "walrus-proxy"
main = "src/index.ts"
compatibility_date = "2025-01-01"
# Cloudflare account that owns this Worker (Currielouis@gmail.com's account).
# Pinned so deploys always target the right account regardless of which
# OAuth login is cached locally.
account_id = "f0249f0a2ab4ce77a77d00ba5e73ad94"

# Cloudflare KV namespace used for per-device rate limiting.
# Create it once with:
#   wrangler kv namespace create RATE_LIMIT
# Then paste the returned id below.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "614499abcea14e4aaa73299f43a8a1d6"

# Shared cache of enrichment results — a growing dictionary of every word
# users have added. First lookup of a word hits Claude; everyone after is
# served from here (free + instant). Create it once with:
#   wrangler kv namespace create ENRICH_CACHE
# then paste the returned id below.
[[kv_namespaces]]
binding = "ENRICH_CACHE"
id = "0057cc75b2204b6da53025c781a15bd9"

[vars]
# Maximum TTS calls per device per UTC day. Lowered for free-tier safety.
DAILY_LIMIT_PER_DEVICE = "200"
# Bundle ID expected from the iOS app — requests with a different one
# are rejected. Adjust if you change the app's bundle ID.
EXPECTED_BUNDLE_ID = "com.louiscurrie.wordrus"

# Secrets — set with `wrangler secret put`. Never commit values here.
# OPENAI_API_KEY: your OpenAI API key (sk-...) — used by /v1/walrus/tts
# ANTHROPIC_API_KEY: your Anthropic API key (sk-ant-...) — used by /enrich, /turn and /story
